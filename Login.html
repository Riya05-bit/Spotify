<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-Form</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>

<div class="form">
    <form id="formate">
        <label for="fName1">First Name</label>
        <input type="text" id="fName1" class="Allinput"><br>

        <label for="lName1">Last Name</label>
        <input type="text" id="lName1" class="Allinput"><br>

        <label for="Email1">Email Id</label>
        <input type="text" id="Email1" class="Allinput"><br>

        <label for="Password1">Password</label>
        <input type="password" id="Password1" class="Allinput"><br>

        <label for="Phone1">Phone Number</label>
        <input type="tel" id="Phone1" class="Allinput"><br>

        <label for="Country1">Country</label>
        <select id="Country1" class="Allinput">
            <option>Choose your country</option>
            <option>India</option>
            <option>U.S</option>
            <option>China</option>
            <option>Japan</option>
            <option>Russia</option>
            <option>Pakistan</option>
            <option>Emirates</option>
            <option>U.K</option>
            <option>Sri Lanka</option>
        </select><br>

        <input type="submit" id="submitbtn1">
    </form>
</div>

<script src="Login.js"></script>
</body>
</html>
